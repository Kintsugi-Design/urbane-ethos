# GitLab CI/CD for Urbane Ethos prototype.
#
# Two jobs:
#   1. content-gates (test stage): two Ruby stdlib checks, run in order —
#      EN/MS key parity across content JSON, then contact-channel drift.
#      Must stay identical (same gates, same order) to the `ci` job in
#      .github/workflows/pages.yml so the two pipelines cannot drift.
#   2. pages (deploy stage): rsync-stage a `public/` artifact (excluding
#      internal dev files), GitLab Pages deploys it automatically.
#
# Conventions GitLab enforces:
#   - The deploy job MUST be named `pages` (case-sensitive).
#   - The artifact MUST be in the `public/` directory.
#   - GitLab Pages picks up the artifact after the job succeeds.
#
# Default URL: https://<group>.gitlab.io/<project>/ (or self-hosted equivalent).
# Custom domain: configure in GitLab Project → Settings → Pages → New Domain.

stages:
  - test
  - deploy

content-gates:
  stage: test
  image: ruby:3.4-alpine
  script:
    - ruby bin/check-i18n-parity.rb
    # Asserts every mailto:/tel:/wa.me literal in the shipped HTML, the blog
    # ERB template and the post sources matches content/en/contact.json.
    # This is the gate that would have caught the info@urbaneethos.center
    # drift: the previous grep gate scanned content/ only, never page markup.
    - ruby bin/check-contact-channels.rb

pages:
  stage: deploy
  image: alpine:3.20
  needs:
    - content-gates
  script:
    - apk add --no-cache rsync
    # Stage only the public prototype — exclude dev-only files so internal
    # plans / specs / scrapes / bundler vendor dirs don't ship to Pages.
    # Mirror exclusions from .github/workflows/pages.yml so GitHub Pages
    # and GitLab Pages publish the same set of files.
    - mkdir -p public
    - >
      rsync -a
      --exclude='.git/'
      --exclude='.github/'
      --exclude='.gitlab/'
      --exclude='.gitlab-ci.yml'
      --exclude='design/'
      --exclude='content/scraped-raw/'
      --exclude='assets/img/scraped/'
      --exclude='.gitignore'
      --exclude='.gstack/'
      --exclude='.claude/'
      --exclude='_brief/'
      --exclude='docs/'
      --exclude='bin/'
      --exclude='test/'
      --exclude='Gemfile'
      --exclude='Gemfile.lock'
      --exclude='node_modules/'
      --exclude='vendor/'
      --exclude='.vscode/'
      --exclude='_site/'
      --exclude='public/'
      --exclude='README.md'
      --exclude='assets/img/photos/'
      --exclude='assets/img/artworks/'
      --exclude='.DS_Store'
      ./ public/
    - ls -la public/ | head -20
  artifacts:
    paths:
      - public
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
